name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements_dev.txt

    - name: Run Black (Formatting check)
      run: black --check --diff backend/

    - name: Run Isort (Imports sorting check)
      run: isort --check-only --profile black --settings-path backend/pyproject.toml backend/


    - name: Run Ruff (Static analysis)
      run: ruff check backend/

    - name: Run Flake8 / Wemake-python-styleguide
      run: flake8 backend/ --config=backend/setup.cfg --select=WPS

    - name: Run Pytest with Coverage
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
        pytest --cov=backend backend/tests/
