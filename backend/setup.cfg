[flake8]
max-line-length = 88
inline-quotes = double
statistics = True
count = True
show-source = True

exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    .pytest_cache,
    .ruff_cache,
    app/migrations/versions/*

max-arguments = 8
max-local-variables = 8
max-attributes = 12
max-module-members = 15
max-imported-names = 60
max-imports = 20
max-try-body-length = 5

nested-classes-whitelist = Meta, Params, Config, Db, ConfigDict

extend-immutable-calls = Depends, fastapi.Depends, Security, fastapi.Security, File, Form

per-file-ignores =
    __init__.py: F401, WPS412
    app/models/__init__.py: WPS410, WPS412
    app/routes/*.py: WPS305, WPS404, WPS226, B008
    tests/*.py: WPS442, S101, WPS432, WPS114, WPS204, WPS218, WPS226, WPS473
    app/migrations/env.py: WPS407, WPS421, Z115, Z412

ignore =
    WPS306,
    WPS221,
    D100, D101, D102, D103, D104, D105, D106, D107,
    WPS110,
    WPS111,
    WPS229,
    WPS420,
    WPS430,
    WPS432,
    WPS604
